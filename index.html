      });

      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:#b5b8d1;">目前篩選條件下沒有符合的 Banner 項目</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map((item, idx) => {
        const pillClass = item.dateType === "urgent" ? "date-pill urgent" : ((item.dateType === "ongoing" || item.dateType === "lottery") ? "date-pill ongoing" : "date-pill");
        const storeClass = item.store === "cosmed" ? "store-pill store-cosmed" : (item.store === "poya" ? "store-pill store-poya" : "store-pill store-watsons");
        const newTag = item.is_new ? '<span class="new-badge">NEW</span>' : '';
        const rowClass = item.is_new ? ' class="is-new-row"' : '';
        const safeTitle = item.title.replace(/'/g, "\'");
        return `
          <tr${rowClass}>
            <td class="col-idx">${String(idx + 1).padStart(2, "0")}</td>
            <td class="col-store"><span class="${storeClass}">${item.storeName}</span></td>
            <td class="col-img">
              <img class="banner-thumb" loading="lazy" src="${item.img_rel}" alt="${item.title}" onclick="openLightbox('${item.img_rel}', '${item.storeName} | ${safeTitle}')" />
            </td>
            <td>
              <div class="event-title">${newTag}${item.title}</div>
              <div class="event-desc">${item.desc}</div>
              <div class="tag-row">
                <span class="cat-tag">${item.category}</span>
                <a class="link-btn" href="${item.href}" target="_blank" rel="noopener">前往活動頁 ↗</a>
              </div>
            </td>
            <td class="col-date">
              <span class="${pillClass}">${item.date}</span>
              <div class="date-note">${item.dateNote}</div>
            </td>
          </tr>
        `;
      }).join("");
    }

    function openLightbox(src, caption) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightboxCaption").textContent = caption;
      document.getElementById("lightbox").classList.add("open");
    }
    function closeLightbox() { document.getElementById("lightbox").classList.remove("open"); }
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });
    document.getElementById("searchInput").addEventListener("input", renderTable);
    document.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderTable();
      });
    });
    renderTable();
  </script>
</body>
</html>
